<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorateur Kobo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f3f0;
    --surface-1: #fcfcfb;
    --border: #e4e2dc;
    --grid: #ebeae6;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #7a7973;
    --accent: #2a78d6;
    --accent-soft: #cde2fb;
    --series-1: #2a78d6;
    --series-1-fill: rgba(42, 120, 214, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #111110;
      --surface-1: #1a1a19;
      --border: #2e2e2b;
      --grid: #282826;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #8f8e86;
      --accent: #3987e5;
      --accent-soft: #184f95;
      --series-1: #3987e5;
      --series-1-fill: rgba(57, 135, 229, .18);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111110;
    --surface-1: #1a1a19;
    --border: #2e2e2b;
    --grid: #282826;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --accent: #3987e5;
    --accent-soft: #184f95;
    --series-1: #3987e5;
    --series-1-fill: rgba(57, 135, 229, .18);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text-primary);
    font: 14px/1.5 Inter, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--text-secondary); font-size: 13px; margin-top: 4px; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .card-sub { color: var(--text-muted); font-size: 12px; margin-bottom: 12px; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .seg { display: inline-flex; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: none; color: var(--text-secondary); font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  select, input[type=search] {
    font: inherit; font-size: 13px; color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; min-width: 0;
  }
  .btn { font: inherit; font-size: 13px; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  .btn:hover, .seg button:not([aria-pressed="true"]):hover { background: var(--grid); }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi, .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; }
  .kpi { padding: 14px 16px; }
  .kpi .label { color: var(--text-secondary); font-size: 12px; font-weight: 500; }
  .kpi .value { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi .hint { color: var(--text-muted); font-size: 12px; }

  .card { padding: 16px; margin-bottom: 16px; min-width: 0; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  .grid2 .card { margin-bottom: 0; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; margin: 28px 0 12px; }
  .chart-box { position: relative; height: 260px; }
  #map { height: 360px; border-radius: 8px; z-index: 0; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th { color: var(--text-secondary); font-weight: 600; position: sticky; top: 0; background: var(--surface-1); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .table-scroll { overflow: auto; max-height: 480px; }
  .table-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .table-tools input { flex: 1 1 200px; }
  .empty { color: var(--text-muted); text-align: center; padding: 48px 16px; }
  .banner { background: var(--accent-soft); color: var(--text-primary); border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
  @media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } .kpi .value { font-size: 24px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">Dashboard Kobo</h1>
      <div class="sub" id="updated">Chargement des données…</div>
    </div>
    <div style="display:flex;gap:8px"><a class="btn" href="./" style="text-decoration:none">← Tableau de bord</a><button class="btn" id="theme" type="button" aria-label="Changer de thème">Thème</button></div>
  </header>

  <div id="banner"></div>

  <div class="filters" role="group" aria-label="Filtres">
    <div class="seg" id="period">
      <button type="button" data-days="0" aria-pressed="true">Tout</button>
      <button type="button" data-days="7" aria-pressed="false">7 j</button>
      <button type="button" data-days="30" aria-pressed="false">30 j</button>
      <button type="button" data-days="90" aria-pressed="false">90 j</button>
    </div>
    <select id="enum" aria-label="Enquêteur" hidden></select>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <h2>Soumissions par jour</h2>
    <div class="card-sub">Nombre de formulaires reçus chaque jour</div>
    <div class="chart-box"><canvas id="timeline" role="img" aria-label="Soumissions par jour"></canvas></div>
  </div>

  <div class="card" id="map-card" hidden>
    <h2>Localisation des soumissions</h2>
    <div class="card-sub" id="map-sub"></div>
    <div id="map"></div>
  </div>

  <div id="cat-section"></div>
  <div id="num-section"></div>

  <div class="section-title">Données</div>
  <div class="card">
    <div class="table-tools">
      <input type="search" id="search" placeholder="Rechercher dans les soumissions…" aria-label="Rechercher">
      <button class="btn" id="csv" type="button">Exporter CSV</button>
    </div>
    <div class="table-scroll"><table id="table"></table></div>
    <div class="card-sub" id="table-note" style="margin:10px 0 0"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  const state = { data: null, days: 0, enumerator: "", search: "" };
  const charts = [];
  let map, markerLayer;
  const nf = new Intl.NumberFormat("fr-FR");
  const nf1 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 1 });
  const $ = (id) => document.getElementById(id);
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const subDate = (s) => s._submission_time ? new Date(s._submission_time.endsWith("Z") ? s._submission_time : s._submission_time + "Z") : null;
  const dayKey = (d) => d.toISOString().slice(0, 10);

  // ---------- Thème ----------
  try { const t = localStorage.getItem("kobo-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  $("theme").addEventListener("click", () => {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    const next = dark ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("kobo-theme", next); } catch (e) {}
    render();
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);

  // ---------- Filtres ----------
  $("period").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.days = +b.dataset.days;
    $("period").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    render();
  });
  $("enum").addEventListener("change", (e) => { state.enumerator = e.target.value; render(); });
  $("search").addEventListener("input", (e) => { state.search = e.target.value.toLowerCase(); renderTable(); });
  $("csv").addEventListener("click", exportCsv);

  function filtered() {
    const subs = state.data.submissions;
    const cutoff = state.days ? Date.now() - state.days * 864e5 : 0;
    return subs.filter((s) => {
      if (state.enumerator && (s._submitted_by || "—") !== state.enumerator) return false;
      if (cutoff) { const d = subDate(s); if (!d || d < cutoff) return false; }
      return true;
    });
  }

  // ---------- Libellés ----------
  function choiceLabel(field, value) {
    const c = (field.choices || []).find((c) => c.name === value);
    return c ? c.label : value;
  }
  function displayValue(field, v) {
    if (v == null || v === "") return "";
    if (field.type === "select_one") return choiceLabel(field, v);
    if (field.type === "select_multiple") return String(v).split(" ").map((x) => choiceLabel(field, x)).join(", ");
    return v;
  }

  // ---------- Chart.js défauts ----------
  function chartDefaults() {
    Chart.defaults.font.family = "Inter, system-ui, sans-serif";
    Chart.defaults.font.size = 12;
    Chart.defaults.color = css("--text-secondary");
    Chart.defaults.borderColor = css("--grid");
    Object.assign(Chart.defaults.plugins.tooltip, {
      backgroundColor: css("--surface-1"), titleColor: css("--text-primary"), bodyColor: css("--text-secondary"),
      borderColor: css("--border"), borderWidth: 1, padding: 10, cornerRadius: 8, displayColors: false,
    });
    Chart.defaults.plugins.legend.display = false;
  }

  // ---------- Rendu ----------
  function render() {
    if (!state.data) return;
    charts.splice(0).forEach((c) => c.destroy());
    chartDefaults();
    const subs = filtered();
    renderKpis(subs);
    renderTimeline(subs);
    renderMap(subs);
    renderCategorical(subs);
    renderNumeric(subs);
    renderTable();
  }

  function renderKpis(subs) {
    const now = Date.now();
    const last7 = subs.filter((s) => { const d = subDate(s); return d && now - d <= 7 * 864e5; }).length;
    const enums = new Set(subs.map((s) => s._submitted_by).filter(Boolean));
    const last = subs.length ? subDate(subs[subs.length - 1]) : null;
    const tiles = [
      ["Soumissions", nf.format(subs.length), state.days ? `sur ${state.days} jours` : "au total"],
      ["7 derniers jours", nf.format(last7), "soumissions récentes"],
      ["Enquêteurs", nf.format(enums.size), "comptes Kobo actifs"],
      ["Dernière soumission", last ? last.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) : "—",
        last ? last.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : "aucune donnée"],
    ];
    $("kpis").innerHTML = tiles.map(([l, v, h]) =>
      `<div class="kpi"><div class="label">${l}</div><div class="value">${v}</div><div class="hint">${h}</div></div>`).join("");
  }

  function renderTimeline(subs) {
    const counts = new Map();
    subs.forEach((s) => { const d = subDate(s); if (d) counts.set(dayKey(d), (counts.get(dayKey(d)) || 0) + 1); });
    const keys = [...counts.keys()].sort();
    const labels = [], values = [];
    if (keys.length) {
      // Remplit les jours sans soumission par 0 pour une échelle de temps continue
      for (let d = new Date(keys[0] + "T00:00:00Z"), end = new Date(keys[keys.length - 1] + "T00:00:00Z"); d <= end; d.setUTCDate(d.getUTCDate() + 1)) {
        const k = dayKey(d); labels.push(k); values.push(counts.get(k) || 0);
      }
    }
    const fmt = (k) => new Date(k + "T00:00:00Z").toLocaleDateString("fr-FR", { day: "numeric", month: "short", timeZone: "UTC" });
    charts.push(new Chart($("timeline"), {
      type: "line",
      data: { labels, datasets: [{ data: values, borderColor: css("--series-1"), backgroundColor: css("--series-1-fill"),
        fill: true, borderWidth: 2, tension: 0, pointRadius: labels.length > 40 ? 0 : 3, pointHoverRadius: 5,
        pointBackgroundColor: css("--series-1"), pointBorderColor: css("--surface-1"), pointBorderWidth: 2 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        scales: {
          x: { grid: { display: false }, ticks: { maxTicksLimit: 8, callback: (v, i) => fmt(labels[i]) } },
          y: { beginAtZero: true, ticks: { precision: 0 }, border: { display: false } },
        },
        plugins: { tooltip: { callbacks: {
          title: (it) => fmt(labels[it[0].dataIndex]),
          label: (it) => `${nf.format(it.parsed.y)} soumission${it.parsed.y > 1 ? "s" : ""}`,
        } } },
      },
    }));
  }

  function geoOf(s) {
    const g = s._geolocation;
    if (Array.isArray(g) && g[0] != null && g[1] != null) return [+g[0], +g[1]];
    const gp = state.data.form.fields.find((f) => f.type === "geopoint" && s[f.name]);
    if (gp) { const [a, b] = String(s[gp.name]).split(" ").map(Number); if (isFinite(a) && isFinite(b)) return [a, b]; }
    return null;
  }

  function renderMap(subs) {
    const pts = subs.map((s) => [s, geoOf(s)]).filter(([, g]) => g);
    const hasGeo = state.data.submissions.some(geoOf);
    $("map-card").hidden = !hasGeo;
    if (!hasGeo || typeof L === "undefined") return;
    $("map-sub").textContent = `${nf.format(pts.length)} point${pts.length > 1 ? "s" : ""} GPS`;
    if (!map) {
      map = L.map("map", { scrollWheelZoom: false }).setView([0, 0], 2);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "© OpenStreetMap" }).addTo(map);
      markerLayer = L.layerGroup().addTo(map);
    }
    markerLayer.clearLayers();
    const color = css("--series-1"), ring = css("--surface-1");
    pts.forEach(([s, g]) => {
      const d = subDate(s);
      L.circleMarker(g, { radius: 6, color: ring, weight: 2, fillColor: color, fillOpacity: .9 })
        .bindTooltip(`${esc(s._submitted_by || "Soumission")} — ${d ? d.toLocaleString("fr-FR") : ""}`)
        .addTo(markerLayer);
    });
    requestAnimationFrame(() => {
      map.invalidateSize();
      if (pts.length) map.fitBounds(pts.map(([, g]) => g), { padding: [24, 24], maxZoom: 13 });
      else map.setView([0, 0], 2);
    });
  }

  function renderCategorical(subs) {
    const fields = state.data.form.fields.filter((f) => f.type === "select_one" || f.type === "select_multiple");
    const sec = $("cat-section");
    if (!fields.length) { sec.innerHTML = ""; return; }
    sec.innerHTML = `<div class="section-title">Réponses aux questions à choix</div><div class="grid2">` +
      fields.map((f, i) => `<div class="card"><h2>${esc(f.label)}</h2><div class="card-sub" id="cat-sub-${i}"></div>
        <div class="chart-box" id="cat-box-${i}"><canvas id="cat-${i}" role="img" aria-label="${esc(f.label)}"></canvas></div></div>`).join("") + `</div>`;

    fields.forEach((f, i) => {
      const counts = new Map((f.choices || []).map((c) => [c.name, 0]));
      let answered = 0;
      subs.forEach((s) => {
        const v = s[f.name]; if (v == null || v === "") return;
        answered++;
        (f.type === "select_multiple" ? String(v).split(" ") : [String(v)])
          .forEach((x) => counts.set(x, (counts.get(x) || 0) + 1));
      });
      const entries = [...counts.entries()];
      const labels = entries.map(([k]) => choiceLabel(f, k));
      const values = entries.map(([, v]) => v);
      $(`cat-sub-${i}`).textContent = `${nf.format(answered)} réponse${answered > 1 ? "s" : ""}` +
        (f.type === "select_multiple" ? " · choix multiples" : "");
      $(`cat-box-${i}`).style.height = Math.max(140, labels.length * 34 + 40) + "px";
      charts.push(new Chart($(`cat-${i}`), {
        type: "bar",
        data: { labels, datasets: [{ data: values, backgroundColor: css("--series-1"), borderRadius: 4,
          borderSkipped: "start", barThickness: 18, maxBarThickness: 18 }] },
        options: {
          indexAxis: "y", responsive: true, maintainAspectRatio: false,
          scales: {
            x: { beginAtZero: true, ticks: { precision: 0 }, border: { display: false } },
            y: { grid: { display: false }, ticks: { color: css("--text-primary"),
              callback: (v, j) => { const t = labels[j]; return t.length > 28 ? t.slice(0, 27) + "…" : t; } } },
          },
          plugins: { tooltip: { callbacks: {
            title: (it) => labels[it[0].dataIndex],
            label: (it) => `${nf.format(it.parsed.x)} (${answered ? nf1.format(it.parsed.x / answered * 100) : 0} % des répondants)`,
          } } },
        },
      }));
    });
  }

  function renderNumeric(subs) {
    const fields = state.data.form.fields.filter((f) => f.type === "integer" || f.type === "decimal" || f.type === "range");
    const sec = $("num-section");
    if (!fields.length) { sec.innerHTML = ""; return; }
    const rows = fields.map((f) => {
      const v = subs.map((s) => parseFloat(s[f.name])).filter((x) => isFinite(x)).sort((a, b) => a - b);
      if (!v.length) return `<tr><td>${esc(f.label)}</td><td class="num">0</td><td class="num">—</td><td class="num">—</td><td class="num">—</td><td class="num">—</td></tr>`;
      const sum = v.reduce((a, b) => a + b, 0);
      const med = v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2;
      return `<tr><td>${esc(f.label)}</td><td class="num">${nf.format(v.length)}</td><td class="num">${nf1.format(sum / v.length)}</td>
        <td class="num">${nf1.format(med)}</td><td class="num">${nf1.format(v[0])}</td><td class="num">${nf1.format(v[v.length - 1])}</td></tr>`;
    });
    sec.innerHTML = `<div class="section-title">Questions numériques</div><div class="card"><div class="table-scroll"><table>
      <thead><tr><th>Question</th><th class="num">Réponses</th><th class="num">Moyenne</th><th class="num">Médiane</th><th class="num">Min</th><th class="num">Max</th></tr></thead>
      <tbody>${rows.join("")}</tbody></table></div></div>`;
  }

  // ---------- Tableau + export ----------
  function tableColumns() {
    return [{ name: "_submission_time", label: "Date", type: "_date" },
      ...(state.data.submissions.some((s) => s._submitted_by) ? [{ name: "_submitted_by", label: "Enquêteur", type: "text" }] : []),
      ...state.data.form.fields.filter((f) => f.type !== "geopoint")];
  }
  function cell(col, s) {
    if (col.type === "_date") { const d = subDate(s); return d ? d.toLocaleString("fr-FR") : ""; }
    return displayValue(col, s[col.name]);
  }
  function tableRows() {
    const cols = tableColumns();
    let rows = filtered().slice().reverse();
    if (state.search) rows = rows.filter((s) => cols.some((c) => String(cell(c, s)).toLowerCase().includes(state.search)));
    return { cols, rows };
  }
  function renderTable() {
    const { cols, rows } = tableRows();
    const shown = rows.slice(0, 200);
    $("table").innerHTML = rows.length
      ? `<thead><tr>${cols.map((c) => `<th>${esc(c.label)}</th>`).join("")}</tr></thead><tbody>` +
        shown.map((s) => `<tr>${cols.map((c) => `<td${["integer", "decimal"].includes(c.type) ? ' class="num"' : ""}>${esc(cell(c, s))}</td>`).join("")}</tr>`).join("") + `</tbody>`
      : `<tbody><tr><td class="empty">Aucune soumission ne correspond aux filtres.</td></tr></tbody>`;
    $("table-note").textContent = rows.length > 200 ? `200 soumissions les plus récentes affichées sur ${nf.format(rows.length)} — l'export CSV contient tout.` : "";
  }
  function exportCsv() {
    const { cols, rows } = tableRows();
    const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const csv = [cols.map((c) => q(c.label)).join(","), ...rows.map((s) => cols.map((c) => q(cell(c, s))).join(","))].join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
    a.download = `kobo-${dayKey(new Date())}.csv`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  // ---------- Chargement ----------
  fetch("data.json", { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((data) => {
      state.data = data;
      document.title = data.form.name || "Dashboard Kobo";
      $("title").textContent = data.form.name || "Dashboard Kobo";
      const up = data.updated_at ? new Date(data.updated_at).toLocaleString("fr-FR", { dateStyle: "long", timeStyle: "short" }) : "—";
      $("updated").textContent = `Données KoboToolbox · mises à jour le ${up}`;
      if (data.demo) $("banner").innerHTML = `<div class="banner">Données de démonstration. Ajoute les secrets <b>KOBO_TOKEN</b> et <b>KOBO_ASSET_UID</b> au dépôt puis lance le workflow pour afficher tes vraies données.</div>`;
      const enums = [...new Set(data.submissions.map((s) => s._submitted_by || "—"))].sort();
      if (enums.length > 1) {
        $("enum").innerHTML = `<option value="">Tous les enquêteurs</option>` + enums.map((e) => `<option>${esc(e)}</option>`).join("");
        $("enum").hidden = false;
      }
      render();
    })
    .catch((e) => {
      $("updated").textContent = "Impossible de charger data.json";
      $("kpis").innerHTML = `<div class="kpi empty" style="grid-column:1/-1">Aucune donnée pour l'instant (${esc(e.message)}). Lance le workflow « Mise à jour des données Kobo » dans l'onglet Actions du dépôt.</div>`;
    });
})();
</script>
</body>
</html>
